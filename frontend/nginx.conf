server {
    listen 80;
    server_name _;

    # Proxy API calls to the backend service. Buffering is disabled so the
    # Server-Sent Events agent trace streams through in real time.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Serve the single-page app.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
